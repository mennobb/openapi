        '400':
          $ref: '#/components/responses/BookingListError'
      parameters:
      - schema:
          type: string
          examples:
          - 102-256952-3
        in: query
        name: resellerReference
        description: Reseller reference associated with the Booking.
      - schema:
          type: string
          examples:
          - 300SK9
        in: query
        name: supplierReference
        description: Supplier reference associated with the Booking.
      - schema:
          type: string
          examples:
          - '2026-05-01'
        in: query
        name: localDate
        description: |-
          Local date of the Booking in ISO 8601 format (YYYY-MM-DD).

          Filters Bookings for a specific date.
      - schema:
          type: string
          examples:
          - '2026-05-01'
        in: query
        name: localDateStart
        description: |-
          Start of the local date range in ISO 8601 format (YYYY-MM-DD).

          MUST be used together with localDateEnd.
      - schema:
          type: string
          examples:
          - '2026-05-31'
        in: query
        name: localDateEnd
        description: |-
          End of the local date range in ISO 8601 format (YYYY-MM-DD).

          MUST be used together with localDateStart.
      - schema:
