      description: |-
        A single contact field that a supplier may require before a Booking can be confirmed. Referenced by `Option.requiredContactFields` for the lead traveler and by `Unit.requiredContactFields` for individual ticket holders.

        Possible values:
        - `firstName`: The first name of the traveler.
        - `lastName`: The last name of the traveler.
        - `fullName`: The full name of the traveler. Used when first/last name separation is not required.
        - `emailAddress`: The email address of the traveler.
        - `phoneNumber`: The phone number of the traveler.
        - `postalCode`: The postal code of the traveler's address.
        - `country`: The country of the traveler.
        - `notes`: Optional free-text notes from the traveler, such as special requests or accessibility requirements.
        - `locales`: The traveler's preferred language(s) for the experience, expressed as BCP 47 locale codes (e.g. `en`, `fr`, `pt-PT`).
