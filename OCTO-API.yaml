  parameters:
    ContentType:
      description: Required field on all POST requests
      in: header
      name: Content-Type
      schema:
        enum:
        - application/json
        type: string
  securitySchemes:
    Auth:
      type: http
      scheme: bearer
  requestBodies:
    BookingCancellation:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                examples:
                - Customer requested
                description: Text value describing why the Booking is cancelled.
              force:
                type: boolean
          examples:
            example-1:
              value:
                reason: Customer Requested
      description: ''
    ExtendReservation:
      content:
        application/json:
          schema:
            type: object
            properties:
              expirationMinutes:
                type: integer
                examples:
                - 15
                description: |-
                  Number of additional minutes to extend the Booking hold period.

                  The total hold duration MUST NOT exceed the Supplier-defined maximum.
          examples:
            example-1:
              value:
                expirationMinutes: 0
    BookingUpdate:
      content:
        application/json:
          schema:
            type: object
            properties:
              resellerReference:
                type: string
                description: Updated Reseller reference associated with the Booking.
                examples:
                - 102-256952-3
              productId:
                type: string
                description: Updated identifier of the Product for the Booking.
                examples:
                - 6b903d44-dc24-4ca4-ae71-6bde6c4f4854
              optionId:
                type: string
                description: Updated identifier of the Option for the Booking.
                examples:
                - DEFAULT
              availabilityId:
                type: string
                description: Updated identifier of the Availability (ISO 8601 datetime) for the Booking.
                examples:
                - '2026-06-30T12:00:00+01:00'
              expirationMinutes:
                type: string
                description: How many minutes to reserve the availability, otherwise defaults to the supplier default amount.
              notes:
                type: string
                description: Updated notes associated with the Booking.
                examples:
                - 'Dietary: vegan'
              emailReceipt:
                type: boolean
                description: Whether you want OCTO Cloud to email the guest a copy of their receipt and tickets. (defaults to false).
              unitItems:
                type: array
                description: An array of unit items in the booking. To retain or modify existing unit items, you must include the unit item with the associated uuid, otherwise that unit item will be removed.
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      description: A unique UUID to identify the unit item.
                    unitId:
                      type: string
                      description: |-
                        Identifier of the Unit type to be booked.

                        All unit items MUST be provided in the request to retain them.
                      examples:
                      - adult
                    resellerReference:
                      $ref: '#/components/schemas/UnitResellerReference'
                    contact:
                      $ref: '#/components/schemas/TicketHolderContact'
                  required:
                  - unitId
              contact:
                $ref: '#/components/schemas/BookingHolderContact'
          examples: {}
    BookingReservation:
      content:
        application/json:
          schema:
            type: object
            properties:
              uuid:
                type: string
                description: |-
                  Unique idempotency key for the booking request.

                  Resellers SHOULD provide a uuid to ensure idempotent booking creation.

                  If the same value is reused, the Supplier MUST return the same result and MUST NOT create a duplicate Booking.
                format: uuid
                examples:
                - 559aed3d-6d5b-4fe0-bfca-99f5e7218a56
              testMode:
                type: boolean
                deprecated: true
                default: false
                description: |-
                  [DEPRECATED] Indicates that the Booking is a test Booking and MUST NOT be fulfilled as a real sale by the Supplier.

                  If provided, the Supplier MUST return the same value in the `testMode` field of the Booking and MUST preserve it for the lifetime of the Booking, including on confirmation.

                  Deprecation advice: Use a test environment for test bookings.
                examples:
                - false
              productId:
                type: string
                description: Identifier of the Product to be booked.
                examples:
                - 6b903d44-dc24-4ca4-ae71-6bde6c4f4854
              optionId:
                type: string
                description: Identifier of the Option to be booked for the selected Product.
                examples:
                - DEFAULT
              availabilityId:
                type: string
                description: |-
                  Identifier of the selected Availability (ISO 8601 datetime) for the Booking.

                  This value MUST be obtained from the `/availability` endpoint.
                examples:
                - '2026-06-30T12:00:00+01:00'
              expirationMinutes:
                type: integer
                description: |-
                  Number of minutes the selected Availability is held before confirmation.

                  If not provided, the Supplier default MUST be applied.

                  After expiration, the held Availability MAY be released and the Booking request MUST be rejected if not confirmed.
                examples:
                - 30
              notes:
                type: string
                description: Additional notes associated with the Booking.
                examples:
                - Wheelchair accessible tour please
              unitItems:
                type: array
                description: A list of unit items that will be included in the booking.
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      description: |-
                        Unique idempotency key for the unit item.

                        If the same value is reused, the Supplier MUST treat the request as idempotent for this unit item.
                      examples:
                      - 3b1bc2ee-3155-4738-9471-f49842a07327
                    unitId:
                      type: string
                      description: |-
                        Identifier of the Unit type to be booked.

                        The value MUST match a valid `unitId` defined in the selected Option.
                      examples:
                      - adult
                  required:
                  - unitId
            required:
            - productId
            - optionId
            - availabilityId
            - unitItems
          examples:
            Reserve Booking:
              value:
                productId: 1a7213eb-3a33-4cbb-b114-64d771c201ac
                optionId: DEFAULT
                availabilityId: '2020-07-01T14:30:00-05:00'
                notes: Optional notes for the booking
                unitItems:
                - unitId: adult
                - unitId: adult
                - unitId: child
      description: ''
    BookingConfirmation:
      content:
        application/json:
          schema:
            type: object
            properties:
              emailReceipt:
                type: boolean
                description: |-
                  Indicates whether the ticket receipt is sent to the guest by email.

                  If not provided, the default value MUST be `false`.
                examples:
                - false
              resellerReference:
                type: string
                description: |-
                  Reseller reference associated with the Booking.

                  This field MUST be provided when required by the Reseller configuration.
                examples:
                - 102-256952-3
              contact:
                allOf:
                - $ref: '#/components/schemas/BookingHolderContact'
                description: Contact details for the main guest who will attend the tour/attraction. Contact schema can be applied to both the booking object (the main reservation) or the unit object (individual ticket holders - if the supplier requires this information).
              unitItems:
                type: array
                description: An array of unit items that will be included in the booking. This allows you to provide contact details or a reseller reference for each unit item. Be careful to make sure you include ALL unit items that you also had in the original booking reservation request, if you provide more or less than in the booking reservation call this will change the number of unit items being purchased also.
                items:
                  type: object
                  properties:
                    uuid:
                      type: string
                      description: |-
                        Unique idempotency key for the unit item.

                        If the same value is reused, the Supplier MUST treat the request as idempotent for this unit item.
                      examples:
                      - 3b1bc2ee-3155-4738-9471-f49842a07327
                    unitId:
                      type: string
                      description: |-
                        Identifier of the Unit type to be confirmed.

                        All unit items MUST be provided.

                        Providing this field MUST replace all existing unit items in the Booking.
                      examples:
                      - adult123
                    resellerReference:
                      allOf:
                      - $ref: '#/components/schemas/UnitResellerReference'
                      description: Reseller reference associated with the individual unit item.
                      examples:
                      - TICKET-001
                    contact:
                      allOf:
                      - $ref: '#/components/schemas/TicketHolderContact'
                      description: Contact details for the main guest who will attend the tour/attraction. Contact schema can be applied to both the booking object (the main reservation) or the unit object (individual ticket holders - if the supplier requires this information).
                  required:
                  - unitId
            required:
            - contact
          examples:
            Confirmation:
              value:
                resellerReference: VOUCHER-0123
                contact:
                  fullName: Oliver Morgan
                  emailAddress: ollym@me.com
                  phoneNumber: '+447840739436'
                  locales:
                  - en-GB
                  - en-US
                  - en
                  country: GB
      description: ''
