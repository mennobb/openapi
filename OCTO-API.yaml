        Returns Bookings that match the provided filters.

        At least one of the following query parameters MUST be included:
        - `resellerReference`
        - `supplierReference`
        - `localDate`
        - `localDateStart` and `localDateEnd`
  /bookings/{uuid}/confirm:
    post:
      summary: Confirm Booking
      tags:
      - Bookings
      operationId: confirmBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                CONFIRMED:
                  $ref: '#/components/examples/BookingConfirmed'
        '400':
          $ref: '#/components/responses/BookingConfirmError'
      description: |-
        Triggers Booking Confirmation, signaling that the Reseller has committed to the purchase. This prompts the Supplier System to persist the Booking and provide the Reseller System with the required ticket(s).
      parameters:
      - $ref: '#/components/parameters/ContentType'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emailReceipt:
                  type: boolean
                  description: |-
                    Indicates whether the ticket receipt is sent to the guest by email.

                    If not provided, the default value MUST be `false`.
                  examples:
                  - false
                resellerReference:
                  type: string
                  description: |-
                    Reseller reference associated with the Booking.

                    This field MUST be provided when required by the Reseller configuration.
                  examples:
                  - 102-256952-3
                contact:
                  type: object
                  description: Contact details for the main guest who will attend the tour/attraction. Contact schema can be applied to both the booking object (the main reservation) or the unit object (individual ticket holders - if the supplier requires this information).
                  properties:
                    fullName:
                      type: string
                      description: |-
                        Full name of the booking holder.

                        This field MAY be used as an alternative to firstName and lastName.
                      examples:
                      - John Doe
                    firstName:
                      type: string
                      description: |-
                        First name of the booking holder.

                        This field MUST be provided if defined in requiredContactFields.
                      examples:
                      - John
                    lastName:
                      type: string
                      description: Last name of the booking holder.
                      examples:
                      - Doe
                    emailAddress:
                      type: string
                      description: Email address of the booking holder.
                      format: email
                      examples:
                      - john@example.com
                    phoneNumber:
                      type: string
                      description: Phone number of the booking holder in E.164 format.
                      examples:
                      - '+447840739436'
                    locales:
                      $ref: '#/components/schemas/Locales'
                      description: Ordered list of preferred locales using BCP 47 language tags.
                    postalCode:
                      type: string
                      description: The PO Box of the booking holder.
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2 country code of the booking holder.
                      examples:
                      - GB
                    notes:
                      type: string
                      description: Optional notes for the booking holder.
                unitItems:
                  type: array
                  description: An array of unit items that will be included in the booking. This allows you to provide contact details or a reseller reference for each unit item. Be careful to make sure you include ALL unit items that you also had in the original booking reservation request, if you provide more or less than in the booking reservation call this will change the number of unit items being purchased also.
                  items:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: |-
                          Unique idempotency key for the unit item.

                          If the same value is reused, the Supplier MUST treat the request as idempotent for this unit item.
                        examples:
                        - 3b1bc2ee-3155-4738-9471-f49842a07327
                      unitId:
                        type: string
                        description: |-
                          Identifier of the Unit type to be confirmed.

                          All unit items MUST be provided.

                          Providing this field MUST replace all existing unit items in the Booking.
                        examples:
                        - adult123
                      resellerReference:
                        $ref: '#/components/schemas/UnitResellerReference'
                        description: Reseller reference associated with the individual unit item.
                        examples:
                        - TICKET-001
                      contact:
                        type: object
                        description: Contact details for the main guest who will attend the tour/attraction. Contact schema can be applied to both the booking object (the main reservation) or the unit object (individual ticket holders - if the supplier requires this information).
                        properties:
                          fullName:
                            type: string
                            description: The full name of the ticket holder. Can also be retrieved as an alias for the concatenation of firstName and lastName.
                            examples:
                            - John Doe
                          firstName:
                            type: string
                            description: The first name of the ticket holder.
                            examples:
                            - John
                          lastName:
                            type: string
                            description: The last name of the ticket holder.
                            examples:
                            - Doe
                          emailAddress:
                            type: string
                            description: The email address of the ticket holder.
                            examples:
                            - johndoe@gmail.com
                          phoneNumber:
                            type: string
                            description: The phone number of the ticket holder.
                          locales:
                            $ref: '#/components/schemas/Locales'
                          postalCode:
                            type: string
                            description: The PO Box of the ticket holder.
                          country:
                            type: string
                            description: The country of the ticket holder.
                          notes:
                            type: string
                            description: Optional notes for the ticket holder.
                    required:
                    - unitId
              required:
              - contact
            examples:
              Confirmation:
                value:
                  resellerReference: VOUCHER-0123
                  contact:
                    fullName: Oliver Morgan
                    emailAddress: ollym@me.com
                    phoneNumber: '+447840739436'
                    locales:
                    - en-GB
                    - en-US
                    - en
                    country: GB
        description: ''
    parameters:
    - schema:
        type: string
        examples:
        - ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
      name: uuid
      in: path
      required: true
      description: Unique identifier of the Booking to be confirmed.
  /bookings/{uuid}/cancel:
    post:
      summary: Cancel Booking
      tags:
      - Bookings
      operationId: cancelBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                CANCELLED:
                  $ref: '#/components/examples/BookingCancelled'
        '400':
          $ref: '#/components/responses/BookingCancelError'
      description: |-
        Cancels a Booking. A Booking MAY only be cancelled if `booking.cancellable` is `true` and the request is within the cancellation cut-off window.
      requestBody:
        $ref: '#/components/requestBodies/BookingCancellation'
      parameters:
      - schema:
          type: string
          enum:
          - application/json
        in: header
        name: Content-Type
        description: Required field on all DELETE requests
    parameters:
    - schema:
        type: string
        examples:
        - ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
      name: uuid
      in: path
      required: true
      description: Unique identifier of the Booking to be cancelled.
  /bookings/{uuid}:
    get:
      summary: Get Booking
      tags:
      - Bookings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                example-1:
                  $ref: '#/components/examples/BookingConfirmed'
        '400':
          $ref: '#/components/responses/BookingGetError'
      operationId: getBooking
      description: |-
        Returns an existing Booking identified by `uuid`.
      parameters:
      - schema:
          type: string
          examples:
          - ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
        name: uuid
        in: path
        required: true
        description: Unique identifier of the Booking to retrieve.
    patch:
      summary: Update Booking
      tags:
      - Bookings
      operationId: updateBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                example-1:
                  $ref: '#/components/examples/BookingUpdated'
        '400':
          $ref: '#/components/responses/BookingConfirmError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resellerReference:
                  type: string
                  description: Updated Reseller reference associated with the Booking.
                  examples:
                  - 102-256952-3
                productId:
                  type: string
                  description: Updated identifier of the Product for the Booking.
                  examples:
                  - 6b903d44-dc24-4ca4-ae71-6bde6c4f4854
                optionId:
                  type: string
                  description: Updated identifier of the Option for the Booking.
                  examples:
                  - DEFAULT
                availabilityId:
                  type: string
                  description: Updated identifier of the Availability (ISO 8601 datetime) for the Booking.
                  examples:
                  - '2026-06-30T12:00:00+01:00'
                expirationMinutes:
                  type: string
                  description: How many minutes to reserve the availability, otherwise defaults to the supplier default amount.
                notes:
                  type: string
                  description: Updated notes associated with the Booking.
                  examples:
                  - 'Dietary: vegan'
                emailReceipt:
                  type: boolean
                  description: Whether you want OCTO Cloud to email the guest a copy of their receipt and tickets. (defaults to false).
                unitItems:
                  type: array
                  description: An array of unit items in the booking. To retain or modify existing unit items, you must include the unit item with the associated uuid, otherwise that unit item will be removed.
                  items:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: A unique UUID to identify the unit item.
                      unitId:
                        type: string
                        description: |-
                          Identifier of the Unit type to be booked.

                          All unit items MUST be provided in the request to retain them.
                        examples:
                        - adult
                      resellerReference:
                        $ref: '#/components/schemas/UnitResellerReference'
                      contact:
                        type: object
                        properties:
                          fullName:
                            type: string
                            description: The full name of the ticket holder. Can also be retrieved as an alias for the concatenation of firstName and lastName.
                            examples:
                            - John Doe
                          firstName:
                            type: string
                            description: The first name of the ticket holder.
                            examples:
                            - John
                          lastName:
                            type: string
                            description: The last name of the ticket holder.
                            examples:
                            - Doe
                          emailAddress:
                            type: string
                            description: The email address of the ticket holder.
                            format: email
                            examples:
                            - johndoe@gmail.com
                          phoneNumber:
                            type: string
                            description: The phone number of the ticket holder.
                          locales:
                            $ref: '#/components/schemas/Locales'
                          postalCode:
                            type: string
                            description: The PO Box of the ticket holder.
                          country:
                            type: string
                            description: The country of the ticket holder.
                          notes:
                            type: string
                            description: Optional notes for the ticket holder.
                    required:
                    - unitId
                contact:
                  type: object
                  properties:
                    fullName:
                      type: string
                      description: The full name of the booking holder. Can also be retrieved as an alias for the concatenation of firstName and lastName.
                      examples:
                      - John Doe
                    firstName:
                      type: string
                      description: First name of the lead traveller.
                      examples:
                      - John
                    lastName:
                      type: string
                      description: Last name of the lead traveller.
                      examples:
                      - Doe
                    emailAddress:
                      type: string
                      description: Email address of the lead traveller.
                      format: email
                      examples:
                      - john@example.com
                    phoneNumber:
                      type: string
                      description: Phone number of the lead traveller in E.164 format.
                      examples:
                      - '+447840739436'
                    locales:
                      $ref: '#/components/schemas/Locales'
                      description: Ordered list of preferred locales for the lead traveller using BCP 47 language tags.
                    postalCode:
                      type: string
                      description: The PO Box of the booking holder.
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2 country code of the lead traveller.
                      examples:
                      - GB
                    notes:
                      type: string
                      description: Optional notes for the booking holder.
            examples: {}
      parameters:
      - schema:
          type: string
          enum:
          - application/json
        in: header
        name: Content-Type
        description: Required field on all PATCH requests
      - schema:
          type: string
          examples:
          - ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
        name: uuid
        in: path
        required: true
        description: Unique identifier of the Booking to be updated.
      description: |-
        Updates a Booking both before and after confirmation, provided no modification restrictions apply. For example: the Booking has not been redeemed and is within the cancellation cut-off window.

        A Booking MUST only be updated if `booking.cancellable` is `true`. If a Booking is cancellable, it SHOULD also be updatable. Updating a Booking SHOULD be preferred over cancelling and recreating it.
  /bookings/{uuid}/extend:
    parameters:
    - schema:
        type: string
        examples:
        - a88b4b8d-9c3b-4a09-ba27-323b43af57e4
      name: uuid
      in: path
      required: true
      description: Unique identifier of the Booking in `ON_HOLD` status.
    post:
      summary: Extend Booking Hold
      tags:
      - Bookings
      operationId: extendBookingHold
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                example-1:
                  $ref: '#/components/examples/BookingOnHold'
        '400':
          $ref: '#/components/responses/BookingExtendError'
      requestBody:
        $ref: '#/components/requestBodies/ExtendReservation'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      description: |-
        Extends the reservation hold for a Booking with `ON_HOLD` status, preserving the reserved availability while additional time is required to complete the Booking. It is up to the Supplier to define what limits to apply.
components:
  schemas:
    FullName:
      type:
      - 'null'
      - string
      examples:
      - John Doe
      description: The full name of the booking holder or the ticket holder. Can also be retrieved as an alias for the concatenation of `firstName` and `lastName`
    FirstName:
      type:
      - 'null'
      - string
      examples:
      - John
      description: The first name of the booking holder or the ticket holder.
    LastName:
      type:
      - 'null'
      - string
      examples:
      - Doe
      description: The last name of the booking holder or the ticket holder.
    EmailAddress:
      type:
      - 'null'
      - string
      format: email
      examples:
      - johndoe@email.com
      description: The email address of the booking holder or the ticket holder.
    PhoneNumber:
      type:
      - 'null'
      - string
      description: The phone number of the booking holder or the ticket holder.
    PostalCode:
      type:
      - 'null'
      - string
      description: The PO Box of the booking holder or the ticket holder.
    Country:
      type:
      - 'null'
      - string
      description: The country of the booking holder or the ticket holder.
    Locales:
      type: array
      description: An array of locale values, equivalent to `navigator.languages` in a browser environment.
      items:
        type: string
        examples:
        - '["en"]'
    BookingHolderContact:
      type: object
      properties:
        country:
          $ref: '#/components/schemas/Country'
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
        firstName:
          $ref: '#/components/schemas/FirstName'
        fullName:
          $ref: '#/components/schemas/FullName'
        lastName:
          $ref: '#/components/schemas/LastName'
        locales:
          $ref: '#/components/schemas/Locales'
        notes:
          type: string
          description: Optional notes for the booking holder.
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        postalCode:
          $ref: '#/components/schemas/PostalCode'
    TicketHolderContact:
      type: object
      properties:
        country:
          $ref: '#/components/schemas/Country'
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
        firstName:
          $ref: '#/components/schemas/FirstName'
        fullName:
          $ref: '#/components/schemas/FullName'
        lastName:
          $ref: '#/components/schemas/LastName'
        locales:
          $ref: '#/components/schemas/Locales'
        notes:
          type: string
          description: Optional notes for the ticket holder.
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        postalCode:
          $ref: '#/components/schemas/PostalCode'
    UnitResellerReference:
      type: string
      description: A reference the reseller uses to identify the unit within all bookings.
    Vacancies:
      type:
      - integer
      - 'null'
      description: This SHOULD NOT be returned when status is `FREESALE`. This SHOULD be a shared pool for all Unit types in the Option. If availability is tracked per-Unit then this value MUST be equal to the available quantity for the Unit that has the most remaining.
      examples:
      - 10
    Product:
      type: object
      x-examples:
        example-1:
          id: 28ca088b-bc7b-4746-ab06-5971f1ed5a5e
          internalName: Edinburgh Hop-On Hop-Off Bus Tour
          reference: null
          locale: en
          timeZone: Europe/London
          allowFreesale: true
          instantConfirmation: true
          instantDelivery: true
          availabilityRequired: false
      examples:
      - id: 6b903d44-dc24-4ca4-ae71-6bde6c4f4854
        internalName: Amazon River Tour
        reference: AMZN
        locale: en-GB
        timeZone: Europe/London
        allowFreesale: true
        instantConfirmation: true
        instantDelivery: true
        availabilityRequired: true
        availabilityType: START_TIME
        deliveryFormats:
        - QRCODE
        deliveryMethods:
        - VOUCHER
        redemptionMethod: DIGITAL
        options:
        - availabilityLocalStartTimes:
          - 09:00
          cancellationCutoff: 1 hour
          cancellationCutoffAmount: 1
          cancellationCutoffUnit: hour
          default: true
          id: DEFAULT
          internalName: Private Morning Tour
          reference: VIP-MORN
          requiredContactFields:
          - firstName
          restrictions:
            maxUnits: 10
            minUnits: 'null'
          units:
          - id: adult_697e3ce8-1860-4cbf-80ad-95857df1f640
            internalName: Adult(s)
            reference: LR1-01-new
            requiredContactFields:
            - firstName
            restrictions:
              accompaniedBy:
              - adult_697e3ce8-1860-4cbf-80ad-95857df1f640
              idRequired: true
              maxAge: 17
              maxQuantity: 7
              minAge: 3
              minQuantity: 2
              paxCount: 1
            type: YOUTH
      description: A bookable product listed by a supplier.
      properties:
        id:
          type: string
          examples:
          - 6b903d44-dc24-4ca4-ae71-6bde6c4f4854
          description: The id used for checking for availability and creating bookings for the product. This MUST be unique within the scope of the Supplier.
        internalName:
          type: string
          description: The name the supplier calls the product.
          examples:
          - Amazon River Tour
        reference:
          type:
          - 'null'
          - string
          description: An optional code this supplier might use to identify the product.
          examples:
          - AMZN
        locale:
          type: string
          examples:
          - en-GB
          description: A language code indicating what language this product content is in. This MUST be a valid BCP 47 RFC 5646 RFC 4647 language tag.
        timeZone:
          type: string
          examples:
          - Europe/London
          description: The IANA TimeZone name this product is located in.
        allowFreesale:
          type: boolean
          description: Whether a booking can be made for this product without having to query availability first.
        instantConfirmation:
          type: boolean
          description: Whether bookings will be immediately confirmed when a sale is made, otherwise the supplier will later either accept or reject the booking. When `instantConfirmation` is set to false one should expect created bookings to first get into a `PENDING` state.
        instantDelivery:
          type: boolean
          description: This indicates whether the Reseller can expect immediate delivery of the customer's tickets. If `false` then the Reseller MUST be able to delay delivery of the tickets to the customer.
        availabilityRequired:
          type: boolean
          description: Whether an `availabilityId` is required when creating a booking. Without this the booking will be open-dated and not have a specified travel date.
        availabilityType:
          $ref: '#/components/schemas/AvailabilityType'
        deliveryFormats:
          type: array
          description: |-
            An array of formats the API will deliver the tickets as. Possible values are:
            `QRCODE` A code to be presented as a QR CODE barcode
            `CODE128A` code to be presented as a CODE 128 barcode
            `PDF_URL` A URL to a PDF file which contains all the ticket details
          items:
            $ref: '#/components/schemas/DeliveryFormat'
        deliveryMethods:
          type: array
          description: |-
            How the formats described in `deliveryFormats` will be delivered in the booking response, possible values are:
            `TICKET`: Individually per unit in the order (i.e. single ticket for each person)
            `VOUCHER`: One ticket for the whole booking
          items:
            $ref: '#/components/schemas/DeliveryMethod'
        redemptionMethod:
          $ref: '#/components/schemas/RedemptionMethod'
        options:
          type: array
          description: An array of all options for this product. All products must have at least one option.
          items:
            $ref: '#/components/schemas/Option'
      required:
      - id
      - internalName
      - reference
      - locale
      - allowFreesale
      - instantConfirmation
      - instantDelivery
      - availabilityRequired
      - availabilityType
      - deliveryFormats
      - deliveryMethods
      - redemptionMethod
      - options
    Unit:
