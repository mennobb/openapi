          - en-GB
          description: Primary language of the Product. MUST conform to IETF BCP 47 (e.g., en-GB, fr-FR).
        timeZone:
          type:
          - string
          - 'null'
          examples:
          - Europe/London
          description: IANA Time Zone identifier for the Product's location (e.g., Europe/London, America/New_York).
        allowFreesale:
          type: boolean
          deprecated: true
          description: |-
            [DEPRECATED] Use availabilityRequired instead.
            Indicates whether an `availabilityId` is required to create a Booking. When false, open-dated Bookings can be created without specifying a travel date.
          examples:
          - true
        instantConfirmation:
          type: boolean
          description: Indicates whether a Booking is immediately confirmed upon a confirmation request. When false, the Booking enters a `PENDING` state until the Supplier accepts or rejects it.
