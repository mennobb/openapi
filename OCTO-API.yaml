      - maxUnits
    Option:
      type: object
      x-examples:
        example-1:
          id: DEFAULT
          default: true
          internalName: DEFAULT
          reference: null
          availabilityLocalStartTimes:
          - 00:00
          cancellationCutoff: 1 hour
          cancellationCutoffAmount: 1
          cancellationCutoffUnit: hour
          requiredContactFields: []
      examples:
      - availabilityLocalStartTimes:
        - 09:00
        cancellationCutoff: 1 hour
        cancellationCutoffAmount: 1
        cancellationCutoffUnit: hour
        default: true
        id: DEFAULT
        internalName: Private Morning Tour
        reference: VIP-MORN
        requiredContactFields:
        - firstName
        restrictions:
          maxUnits: 10
          minUnits: 'null'
