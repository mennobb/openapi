        accompaniedBy:
          type: array
          description: This is if the unit needs to be accompanied by another unit (eg. Infant with Adult)
          items:
            type: string
            examples:
            - adult_697e3ce8-1860-4cbf-80ad-95857df1f640
      required:
      - minAge
      - maxAge
