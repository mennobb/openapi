    DeliveryMethod:
      type: string
      title: DeliveryMethod
      enum:
      - VOUCHER
      - TICKET
      description: |-
        A single method by which tickets or vouchers are delivered for a Booking. Referenced by `Product.deliveryMethods` for the methods a Product supports, and by `Booking.deliveryMethods` for the methods applied to a given Booking.

        Possible values:
        - "VOUCHER": A single voucher is delivered for the entire Booking (e.g., all people in the Booking share one voucher). The `Booking.voucher` object is populated.
        - "TICKET": A separate ticket is delivered per unit item (e.g., each person in the Booking receives an individual ticket). `UnitItem.ticket` is populated on every unit item.

        For each method present in `Booking.deliveryMethods`, the corresponding object MUST be populated in the Booking response; the object for a method that is absent MUST be `null`. When `Booking.deliveryMethods` contains both values, both objects MUST be populated.

        When a Product supports both methods, the Reseller MAY select the method that best fits their integration, or offer both options to the end customer.
      examples:
      - TICKET
    DeliveryFormat:
      type: string
      title: DeliveryFormat
      enum:
      - QRCODE
      - PDF_URL
      - CODE128
      - AZTEC
      - PDF417
      - PKPASS_URL
      - GOOGLE_WALLET_URL
      - DOTCODE
      - DATAMATRIX
      - HANXIN
      - HTML_URL
      - IMAGE_URL
      description: |-
        A single format in which a ticket or voucher can be delivered. Referenced by `Product.deliveryFormats` for the formats a Product supports, and by `Ticket.deliveryOptions[].deliveryFormat` for the format of a delivered ticket or voucher.

        The payload itself is carried in `Ticket.deliveryOptions[].deliveryValue`, either as an encoded string or as a URL, depending on the format.

        Possible values:
        - "QRCODE": A two-dimensional matrix barcode conforming to ISO/IEC 18004, encoded as a string. The Client MUST render the QR code.
        - "PDF_URL": A URL resolving to a downloadable PDF document containing ticket details. The Client MUST retrieve and present the PDF to the customer.
        - "CODE128": A high-density linear barcode conforming to ISO/IEC 15417, encoded as a string. The Client MUST render the barcode.
        - "AZTEC": A two-dimensional matrix barcode conforming to ISO/IEC 24778, encoded as a string. The Client MUST render the barcode.
        - "PDF417": A stacked two-dimensional barcode conforming to ISO/IEC 15438, encoded as a string. The Client MUST render the barcode.
        - "PKPASS_URL": A URL resolving to a PKPass file compatible with Apple Wallet. The Client MUST present the pass to the customer.
        - "GOOGLE_WALLET_URL": A URL resolving to a Google Wallet pass. The Client MUST present the pass to the customer.
        - "DOTCODE": A two-dimensional barcode optimized for high-speed inkjet printing, encoded as a string. The Client MUST render the barcode.
        - "DATAMATRIX": A two-dimensional matrix barcode conforming to ISO/IEC 16022, encoded as a string. The Client MUST render the barcode.
        - "HANXIN": A two-dimensional matrix barcode conforming to GB/T 27766 with native support for Chinese characters, encoded as a string. The Client MUST render the barcode.
        - "HTML_URL": A URL resolving to an HTML page containing ticket details. The Client MUST retrieve and present the content to the customer.
        - "IMAGE_URL": A URL resolving to an image file containing the ticket. The Client MUST retrieve and present the image to the customer.
      examples:
      - QRCODE
    AvailabilityType:
      type: string
      title: AvailabilityType
      enum:
      - START_TIME
      - OPENING_HOURS
      description: |-
        Specifies the type of Availability for the Product.

        Possible values:
        - "START_TIME": For Products with fixed departure times (e.g., a walking tour at set times during the day).
        - "OPENING_HOURS": For Products where customers select a date and can visit anytime during operating hours (e.g., a museum general admission ticket valid at any time when the museum is open).
      examples:
      - OPENING_HOURS
    DurationUnit:
      type: string
      title: DurationUnit
      enum:
      - hour
      - minute
      - day
      examples:
      - hour
      description: |-
        Time unit for the cancellation cutoff period.

        Possible values:
        - "hour": Hours unit for cancellation cutoff duration.
        - "minute": Minutes unit for cancellation cutoff duration.
        - "day": Days unit for cancellation cutoff duration.
    RedemptionMethod:
      type: string
      title: RedemptionMethod
      enum:
      - DIGITAL
      - PRINT
      - MANIFEST
      description: |-
        Specifies the redemption method for the Product.

        Possible values:
        - "DIGITAL": The ticket MUST be scanned and MAY be presented on a mobile device.
        - "PRINT": The ticket MUST be printed and presented physically upon arrival.
        - "MANIFEST": The guest name is on a manifest. Ticket scanning is not required; the guest MUST present themselves at arrival.
      examples:
      - DIGITAL
    Supplier:
      type: object
      examples:
      - id: 697e3ce8-1860-4cbf-80ad-95857df1f640
        name: Merlin Entertainments
        endpoint: https://trade.api.merlinentertainments.biz/b2b-trade/octo
        contact:
          website: https://www.merlinentertainments.biz
          email: info@merlinentertainments.biz
          telephone: '+441202666900'
          address: Link House, 25 West St, Poole BH15 1LD, United Kingdom
      properties:
        id:
          type: string
          examples:
          - 697e3ce8-1860-4cbf-80ad-95857df1f640
          description: A unique identifier for this Supplier. MUST NOT exceed 255 printable ASCII characters.
        name:
          type: string
          description: The human-readable name of this Supplier, used to identify it within the system.
          examples:
          - Merlin Entertainments
        endpoint:
          type: string
          format: uri
          deprecated: true
          description: '[DEPRECATED] The base URL prepended to all API request paths. MUST be a valid URI and MUST NOT include a trailing slash.'
          examples:
          - https://trade.api.merlinentertainments.biz/b2b-trade/octo
        contact:
          description: The contact details for this Supplier, including available communication methods and mailing address.
          type: object
          required:
          - website
          - email
          - telephone
          - address
          properties:
            website:
              type:
              - 'null'
              - string
              format: uri
              description: The official website URL of this Supplier. MUST be a valid URI and MUST NOT include a trailing slash.
              examples:
              - https://www.merlinentertainments.biz
            email:
              type:
              - 'null'
              - string
              format: email
              description: The customer service email address for this Supplier.
              examples:
              - info@merlinentertainments.biz
            telephone:
              type:
              - 'null'
              - string
              description: The customer service telephone number for this Supplier. MUST be formatted according to E.164.
              examples:
              - '+441202666900'
            address:
              type:
              - 'null'
              - string
              description: The full mailing address for this Supplier, provided as a single string. SHOULD include street, city, postal code, and country.
              examples:
              - Link House, 25 West St, Poole BH15 1LD, United Kingdom
      required:
      - id
      - name
      - contact
    Availability:
      type: object
      examples:
      - id: '2026-02-28T00:00:00+00:00'
        localDateTimeStart: '2026-02-28T00:00:00+00:00'
        localDateTimeEnd: '2026-03-01T00:00:00+00:00'
        allDay: true
        available: true
        status: FREESALE
        vacancies: null
        capacity: null
        maxUnits: null
        utcCutoffAt: '2026-02-27T22:00:00Z'
        openingHours:
        - from: '09:00'
          to: '17:00'
      - id: FE32BA12
        localDateTimeStart: '2026-02-28T09:00:00+00:00'
        localDateTimeEnd: '2026-02-28T09:30:00+00:00'
        allDay: false
        available: true
        status: AVAILABLE
        vacancies: 10
        capacity: 10
        maxUnits: 10
        utcCutoffAt: '2026-02-28T08:00:00Z'
        openingHours: []
      title: ''
      description: Schema for the `/availability/calendar` endpoint. It's designed to be queried for large date ranges and the result is used to populate an availability calendar.
      properties:
        id:
          type: string
          examples:
          - FE32BA12
          - '2022-05-23T00:00:00+01:00'
          description: Unique availability identifier. Used as availabilityId when booking. Unique within the context of the respective Product. (Max. 255 ASCII characters)
        localDateTimeStart:
          type: string
          examples:
          - '2022-06-30T12:00:00+01:00'
          description: Local start datetime of this slot
          format: date-time
        localDateTimeEnd:
          type: string
          examples:
          - '2022-06-30T14:00:00+01:00'
          description: Local end datetime of this slot
          format: date-time
        allDay:
          type: boolean
          description: If true, this is an all-day slot (not a fixed departure time). No other availability on same day.
          examples:
          - false
        available:
          type: boolean
          deprecated: true
          description: '[DEPRECATED] Indicates whether at least one vacancy is available. This field is deprecated and SHOULD NOT be used. The `status` field SHOULD be used instead.'
          examples:
          - true
        status:
          $ref: '#/components/schemas/AvailabilityStatus'
        vacancies:
          $ref: '#/components/schemas/Vacancies'
        capacity:
          type:
          - integer
          - 'null'
          examples:
          - 10
          description: Indicates the total available capacity. A `null` value MAY be returned when capacity details cannot be reliably shared. This SHOULD NOT be done unless necessary.
        maxUnits:
          type:
          - integer
          - 'null'
          examples:
          - 10
          description: Max units that can be in a single booking on this timeslot. A `null` value implies there's no explicit limit.
        utcCutoffAt:
          type: string
          examples:
          - '2022-06-30T10:00:00Z'
          description: UTC time by which a booking must be confirmed
        openingHours:
          description: Opening hours for this day (empty array for START_TIME products)
          type: array
          items:
            $ref: '#/components/schemas/OpeningHours'
      required:
      - id
      - localDateTimeStart
      - localDateTimeEnd
      - allDay
      - available
      - status
      - vacancies
      - capacity
      - maxUnits
      - utcCutoffAt
      - openingHours
    AvailabilityStatus:
      type: string
      title: AvailabilityStatus
      enum:
      - AVAILABLE
      - FREESALE
      - SOLD_OUT
      - LIMITED
      - CLOSED
      description: |-
        Indicates the availability status for the given date.

        Possible values:
        - "AVAILABLE": Slot is available with remaining capacity.
        - "FREESALE": No capacity limit, always available. The `vacancies` and `capacity` fields do not convey a capacity constraint; `vacancies` MUST be returned as `null` (see `Vacancies`).
        - "SOLD_OUT": No remaining capacity for this date/slot.
        - "LIMITED": Available, but less than 50% of capacity remaining.
        - "CLOSED": The venue/Product is closed on this date/slot.
      examples:
      - AVAILABLE
    AvailabilityCalendar:
      type: object
      examples:
      - localDate: '2026-02-25'
        available: true
        status: AVAILABLE
        vacancies: 10
        capacity: 10
        openingHours:
        - from: '09:00'
          to: '17:00'
      description: Schema for the `/availability/calendar` endpoint. For querying general open slots per day on a large range of days versus availability per departure time.
      properties:
        localDate:
          type: string
          examples:
          - '2022-05-12'
          description: The date in ISO 8601 format (YYYY-MM-DD)
          format: date
        available:
          type: boolean
          deprecated: true
          description: '[DEPRECATED] Indicates whether at least one vacancy is available. This field is deprecated and SHOULD NOT be used. The `status` field SHOULD be used instead.'
          examples:
          - true
        status:
          $ref: '#/components/schemas/AvailabilityStatus'
        vacancies:
          $ref: '#/components/schemas/Vacancies'
        capacity:
          type:
          - integer
          - 'null'
          examples:
          - 10
          description: Indicates the total available capacity. A `null` value MAY be returned when capacity details cannot be reliably shared. This SHOULD NOT be done unless necessary.
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHours'
      required:
      - localDate
      - available
      - status
      - vacancies
      - capacity
      - openingHours
    OpeningHours:
      type: object
      description: A list of opening hours that the product is open on this day.
      properties:
        from:
          type: string
          examples:
          - 09:00
          description: Opening time
        to:
          type: string
          examples:
          - '17:00'
          description: Closing time
      required:
      - from
      - to
      examples:
      - from: '09:00'
        to: '17:00'
    BookingStatus:
      type: string
      title: BookingStatus
      enum:
      - ON_HOLD
      - CONFIRMED
      - EXPIRED
      - CANCELLED
      - REDEEMED
      - PENDING
      - REJECTED
      examples:
      - CONFIRMED
      description: |-
        Current Booking status.

        Possible values:
        - "ON_HOLD": The Booking is pending confirmation. This is the default value when the Booking is created.
        - "CONFIRMED": The Booking has been confirmed and is ready to be used.
        - "EXPIRED": The Booking is not confirmed before the hold expiration and enters an expired state.
        - "CANCELLED": The Booking has been cancelled.
        - "REDEEMED": The Booking has already been redeemed.
        - "PENDING": The Booking is awaiting external confirmation from the Supplier (`instantConfirmation=false`).
        - "REJECTED": The Booking was rejected by the Supplier.
    UnitItem:
      type: object
      properties:
        uuid:
          type: string
          examples:
          - 3b1bc2ee-3155-4738-9471-f49842a07327
          description: Per-unit item identifier conforming to the UUID standard.
        resellerReference:
          type:
          - string
          - 'null'
          examples:
          - TICKET-001
          description: Per-ticket reseller reference. Omitting this value MAY complicate cross-referencing between the Reseller and the Supplier.
        supplierReference:
          type:
          - string
          - 'null'
          examples:
          - J9T7R6
          description: Per-ticket supplier reference. Omitting this value MAY complicate cross-referencing between the Reseller and the Supplier.
        unitId:
          description: Unit type ID (references the `Unit.id` field in the Option object)
          type: string
          examples:
          - adult
        unit:
          description: Embedded `Unit` definition.
          allOf:
          - $ref: '#/components/schemas/Unit'
        status:
          description: |-
            Status of this individual ticket item.
            - "ON_HOLD": The booking is pending confirmation. This is the default value when the booking is created.
            - "CONFIRMED": The booking has been confirmed and is ready to be used.
            - "EXPIRED": The booking is not confirmed before the hold expiration and enters an expired state.
            - "CANCELLED": The booking has been cancelled.
            - "REDEEMED": The booking has already been redeemed.
            - "PENDING": The booking is awaiting external confirmation from the Supplier (`instantConfirmation: false`).
            - "REJECTED": The booking was rejected by the Supplier.
          allOf:
          - $ref: '#/components/schemas/BookingStatus'
        utcRedeemedAt:
          type:
          - 'null'
          - string
          description: ISO 8601 UTC timestamp indicating when the Ticket/Voucher was redeemed. `null` value implies that redemption hasn't happened or the system does not have this information
          examples:
          - null
        contact:
          description: Per-ticket contact details, to be populated in accordance with the requirements provided in `Unit.requiredContactFields`
          allOf:
          - $ref: '#/components/schemas/Contact'
        ticket:
          description: Per-ticket delivery payload (if "TICKET" in `Booking`.`deliveryMethods`). A `null` value implies there are no individual tickets.
          oneOf:
          - $ref: '#/components/schemas/Ticket'
          - type: 'null'
      required:
      - uuid
      - resellerReference
      - supplierReference
      - unitId
      - unit
      - status
      - utcRedeemedAt
      - contact
      description: ''
      examples:
      - uuid: 3b1bc2ee-3155-4738-9471-f49842a07327
        resellerReference: TICKET-001
        supplierReference: J9T7R6
        unitId: adult_697e3ce8
        unit:
          id: adult_697e3ce8
          internalName: Adult(s)
          reference: LR1-01
          type: ADULT
          requiredContactFields:
          - firstName
          - lastName
          restrictions:
            minAge: 18
            maxAge: 99
            idRequired: false
            minQuantity: 1
            maxQuantity: 7
            paxCount: 1
            accompaniedBy: []
        status: CONFIRMED
        utcRedeemedAt: null
        contact:
          firstName: John
          lastName: Doe
          locales:
          - en-GB
        ticket:
          redemptionMethod: DIGITAL
          utcRedeemedAt: null
          deliveryOptions:
          - deliveryFormat: QRCODE
            deliveryValue: DIE382Q388455
          - deliveryFormat: PDF_URL
            deliveryValue: https://api.octomock.com/octo/pdf?booking=ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
    Ticket:
      type: object
      examples:
      - redemptionMethod: DIGITAL
        utcRedeemedAt: null
        deliveryOptions:
        - deliveryFormat: QRCODE
          deliveryValue: DIE382Q388455
        - deliveryFormat: PDF_URL
          deliveryValue: https://api.octomock.com/octo/pdf?booking=ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
      properties:
        redemptionMethod:
          $ref: '#/components/schemas/RedemptionMethod'
        utcRedeemedAt:
          type:
          - 'null'
          - string
          description: ISO 8601 UTC timestamp indicating when the Ticket/Voucher was redeemed. `null` value implies that redemption hasn't happened or the system does not have this information
          examples:
          - '2026-03-01T13:28:43Z'
        deliveryOptions:
          description: Object containing available delivery options for the ticket or voucher. Each item defines a `deliveryFormat` and its corresponding `deliveryValue`.
          type: array
          items:
            type: object
            properties:
              deliveryFormat:
                $ref: '#/components/schemas/DeliveryFormat'
              deliveryValue:
                type: string
                description: Ticket payload or URL, depending on the `deliveryFormat`.
                examples:
                - https://api.octomock.com/octo/pdf?booking=ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
                - DIE382Q388455
            required:
            - deliveryFormat
            - deliveryValue
      required:
      - redemptionMethod
      - utcRedeemedAt
      - deliveryOptions
      description: ''
    Contact:
      type: object
      examples:
      - fullName: John Doe
        firstName: John
        lastName: Doe
        emailAddress: john@example.com
        phoneNumber: '+44 7777 777777'
        locales:
        - en-GB
        postalCode: W1H 7EJ
        country: GB
        notes: 'Dietary: vegan'
      description: Contact details for the guests that will attend the tour/attraction. Contact schema can be applied to both the booking object (the main reservation) or the unit object (individual ticket holders - if the supplier requires this information)
      properties:
        fullName:
          $ref: '#/components/schemas/FullName'
        firstName:
          $ref: '#/components/schemas/FirstName'
        lastName:
          $ref: '#/components/schemas/LastName'
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        locales:
          type: array
          description: Locale preferences following BCP 47 (Best Current Practice) by the IETF community.
          items:
            type: string
            examples:
            - en-GB
        postalCode:
          $ref: '#/components/schemas/PostalCode'
        country:
          $ref: '#/components/schemas/Country'
        notes:
          type:
          - 'null'
          - string
          description: |-
            A general note related to the Contact that MAY be used to share information that is relevant to all parties but cannot be communicated through an existing capability or structured field.

            This field is intended for exceptional or case-specific information only. Implementations SHOULD NOT use it as a substitute for existing capabilities, attributes, or standardized data models.

            Information provided in this field MUST be considered visible to all relevant parties.
          examples:
          - 'Dietary: vegan'
