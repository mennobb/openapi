  /bookings/{uuid}/confirm:
    post:
      summary: Confirm Booking
      tags:
      - Bookings
      operationId: confirmBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                CONFIRMED:
                  $ref: '#/components/examples/BookingConfirmed'
        '400':
          $ref: '#/components/responses/BookingConfirmError'
      description: |-
        Triggers Booking Confirmation, signaling that the Reseller has committed to the purchase. This prompts the Supplier System to persist the Booking and provide the Reseller System with the required ticket(s).
      parameters:
      - $ref: '#/components/parameters/ContentType'
      requestBody:
        $ref: '#/components/requestBodies/BookingConfirmation'
    parameters:
    - schema:
        type: string
        examples:
        - ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
      name: uuid
      in: path
      required: true
      description: Unique identifier of the Booking to be confirmed.
  /bookings/{uuid}/cancel:
    post:
      summary: Cancel Booking
      tags:
      - Bookings
      operationId: cancelBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                CANCELLED:
                  $ref: '#/components/examples/BookingCancelled'
        '400':
          $ref: '#/components/responses/BookingCancelError'
      description: |-
        Cancels a Booking. A Booking MAY only be cancelled if `booking.cancellable` is `true` and the request is within the cancellation cut-off window.
      requestBody:
        $ref: '#/components/requestBodies/BookingCancellation'
      parameters:
      - schema:
          type: string
          enum:
          - application/json
        in: header
        name: Content-Type
        description: Required field on all DELETE requests
    parameters:
    - schema:
        type: string
        examples:
        - ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
      name: uuid
      in: path
      required: true
      description: Unique identifier of the Booking to be cancelled.
  /bookings/{uuid}:
    get:
      summary: Get Booking
      tags:
      - Bookings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                example-1:
                  $ref: '#/components/examples/BookingConfirmed'
        '400':
          $ref: '#/components/responses/BookingGetError'
      operationId: getBooking
      description: |-
        Returns an existing Booking identified by `uuid`.
      parameters:
      - schema:
          type: string
          examples:
          - ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
        name: uuid
        in: path
        required: true
        description: Unique identifier of the Booking to retrieve.
    patch:
      summary: Update Booking
      tags:
      - Bookings
      operationId: updateBooking
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                example-1:
                  $ref: '#/components/examples/BookingUpdated'
        '400':
          $ref: '#/components/responses/BookingConfirmError'
      requestBody:
        $ref: '#/components/requestBodies/BookingUpdate'
      parameters:
      - schema:
          type: string
          enum:
          - application/json
        in: header
        name: Content-Type
        description: Required field on all PATCH requests
      - schema:
          type: string
          examples:
          - ec0ce0c2-03f0-4c64-bbc5-5e0f7d1e1c0a
        name: uuid
        in: path
        required: true
        description: Unique identifier of the Booking to be updated.
      description: |-
        Updates a Booking both before and after confirmation, provided no modification restrictions apply. For example: the Booking has not been redeemed and is within the cancellation cut-off window.

        A Booking MUST only be updated if `booking.cancellable` is `true`. If a Booking is cancellable, it SHOULD also be updatable. Updating a Booking SHOULD be preferred over cancelling and recreating it.
  /bookings/{uuid}/extend:
    parameters:
    - schema:
        type: string
        examples:
        - a88b4b8d-9c3b-4a09-ba27-323b43af57e4
      name: uuid
      in: path
      required: true
      description: Unique identifier of the Booking in `ON_HOLD` status.
    post:
      summary: Extend Booking Hold
      tags:
      - Bookings
      operationId: extendBookingHold
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                example-1:
                  $ref: '#/components/examples/BookingOnHold'
        '400':
          $ref: '#/components/responses/BookingExtendError'
      requestBody:
        $ref: '#/components/requestBodies/ExtendReservation'
      parameters:
      - $ref: '#/components/parameters/ContentType'
      description: |-
        Extends the reservation hold for a Booking with `ON_HOLD` status, preserving the reserved availability while additional time is required to complete the Booking. It is up to the Supplier to define what limits to apply.
components:
  schemas:
    FullName:
      type:
      - 'null'
      - string
      examples:
      - John Doe
      description: The full name of the booking holder or the ticket holder. Can also be retrieved as an alias for the concatenation of `firstName` and `lastName`.
    FirstName:
      type:
      - 'null'
      - string
      examples:
      - John
      description: The first name of the booking holder or the ticket holder.
    LastName:
      type:
      - 'null'
      - string
      examples:
      - Doe
      description: The last name of the booking holder or the ticket holder.
    EmailAddress:
      type:
      - 'null'
      - string
      format: email
      examples:
      - john@example.com
      description: The email address of the booking holder or the ticket holder.
    PhoneNumber:
      type:
      - 'null'
      - string
      description: The phone number of the booking holder or the ticket holder.
      examples:
      - +44 7777 777777
    PostalCode:
      type:
      - 'null'
      - string
      description: The postal / ZIP code of the booking holder or the ticket holder.
      examples:
      - W1H 7EJ
    Country:
      type:
      - 'null'
      - string
      description: The country code of the booking holder or the ticket holder. MUST use ISO 3166-1 alpha-2.
      examples:
      - GB
    Locales:
      type: array
      description: An array of locale values, equivalent to `navigator.languages` in a browser environment.
      items:
        type: string
        examples:
        - '["en"]'
    BookingHolderContact:
      type: object
      properties:
        country:
          $ref: '#/components/schemas/Country'
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
        firstName:
          $ref: '#/components/schemas/FirstName'
        fullName:
          $ref: '#/components/schemas/FullName'
        lastName:
          $ref: '#/components/schemas/LastName'
        locales:
          $ref: '#/components/schemas/Locales'
        notes:
          type: string
          description: Optional notes for the booking holder.
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        postalCode:
          $ref: '#/components/schemas/PostalCode'
    TicketHolderContact:
      type: object
      properties:
        country:
          $ref: '#/components/schemas/Country'
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
        firstName:
          $ref: '#/components/schemas/FirstName'
        fullName:
          $ref: '#/components/schemas/FullName'
        lastName:
          $ref: '#/components/schemas/LastName'
        locales:
          $ref: '#/components/schemas/Locales'
        notes:
          type: string
          description: Optional notes for the ticket holder.
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        postalCode:
          $ref: '#/components/schemas/PostalCode'
    UnitResellerReference:
      type: string
      description: A reference the reseller uses to identify the unit within all bookings.
    Vacancies:
      type:
      - integer
      - 'null'
      description: Indicates the number of remaining vacancies. This value SHOULD be less than or equal to `capacity`. A `null` value MUST be returned when `status` equals `FREESALE`. A `null` value MAY be returned when capacity details cannot be reliably shared. This SHOULD NOT be done unless necessary. In this case, the `status` field SHOULD be used as an approximate indication of remaining availability.
      examples:
      - 10
