        instantDelivery:
          type: boolean
          description: |-
            Indicates whether Tickets are delivered to the Reseller immediately after Booking confirmation. When `false`, the Reseller MUST be able to delay delivery to the customer. The Reseller MUST either implement a polling mechanism or use the "Notifications" capability to detect when the Tickets have become available.
            Note that the specification does not define a formal requirement for acceptable delays.
          examples:
          - true
        availabilityRequired:
          type: boolean
          description: |-
            Indicates whether Availability MUST be checked before creating a Booking.
            If `true`, the Reseller MUST retrieve Availability using the /availability endpoint and provide a valid availabilityId when creating a Booking.
            If `false`, a Booking MAY be created without retrieving Availability in advance.

            Indicates whether an `availabilityId` is required to create a Booking. When false, open-dated Bookings can be created without specifying a travel date.
          examples:
          - true
        availabilityType:
          $ref: '#/components/schemas/AvailabilityType'
        deliveryFormats:
          type: array
          description: Specifies the ticket or voucher delivery formats supported by this Product. Each value MUST be a `DeliveryFormat`, which defines the meaning of each format and the Client's obligations when presenting it.
          items:
            $ref: '#/components/schemas/DeliveryFormat'
        deliveryMethods:
          type: array
          description: Specifies the ticket or voucher delivery methods supported by this Product. Each value MUST be a `DeliveryMethod`, which defines the meaning of each method and which objects it populates in the Booking response.
